<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ORA 5 Farben – Click Unfold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="module.css?v=1">
  <style>
    html,body{margin:0;background:#fff}body{overflow-x:hidden}.demo-nav{position:fixed;z-index:100;top:0;right:0;left:0;height:5rem;padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;color:#fff;background:#101311;font:800 .72rem/1 "Libre Franklin",Arial,sans-serif;letter-spacing:.1em}.demo-nav strong{font-size:1rem}.demo-nav em{font-style:normal;opacity:.64}@media(max-width:900px){.demo-nav{height:7.5rem;padding:0 1rem}.demo-nav em{font-size:.6rem}}
  </style>
</head>
<body>
  <header class="demo-nav"><strong>GWM · ORA 5</strong><em>FARBSELECTOR</em></header>
  <div class="gwm-ora5-colors-v2" data-gwm-colors-v2 data-interaction="click">
    <section class="gwm-ora5-colors-v2__stage" aria-label="ORA 5 Farbe auswählen">
      <div class="gwm-ora5-colors-v2__panels">
        <div class="gwm-ora5-colors-v2__panel" data-color-panel="0" data-slice-start="0" data-slice-end="85.714286" style="--slice-start:0%;--slice-end:85.714286%;--tone:#e8e3de"><div class="gwm-ora5-colors-v2__panel-bg"></div><img src="images/dover-white-1920.webp" width="1920" height="1234" alt="ORA 5 in Dover White"></div>
        <div class="gwm-ora5-colors-v2__panel" data-color-panel="4" data-slice-start="14.285714" data-slice-end="71.428572" style="--slice-start:14.285714%;--slice-end:71.428572%;--tone:#c4c2be"><div class="gwm-ora5-colors-v2__panel-bg"></div><img src="images/cloud-white-1920.webp" width="1920" height="1234" alt="ORA 5 in Cloud White"></div>
        <div class="gwm-ora5-colors-v2__panel" data-color-panel="2" data-slice-start="28.571428" data-slice-end="57.142858" style="--slice-start:28.571428%;--slice-end:57.142858%;--tone:#a6a6a6"><div class="gwm-ora5-colors-v2__panel-bg"></div><img src="images/glacier-grey-1920.webp" width="1920" height="1234" alt="ORA 5 in Glacier Grey"></div>
        <div class="gwm-ora5-colors-v2__panel" data-color-panel="5" data-slice-start="42.857142" data-slice-end="42.857144" style="--slice-start:42.857142%;--slice-end:42.857144%;--tone:#676f7d"><div class="gwm-ora5-colors-v2__panel-bg"></div><img src="images/ayers-grey-1920.webp" width="1920" height="1234" alt="ORA 5 in Ayers Grey"></div>
        <div class="gwm-ora5-colors-v2__panel" data-color-panel="3" data-slice-start="57.142856" data-slice-end="28.57143" style="--slice-start:57.142856%;--slice-end:28.57143%;--tone:#0c4836"><div class="gwm-ora5-colors-v2__panel-bg"></div><img src="images/forest-green-1920.webp" width="1920" height="1234" alt="ORA 5 in Forest Green"></div>
        <div class="gwm-ora5-colors-v2__panel" data-color-panel="6" data-slice-start="71.42857" data-slice-end="14.285716" style="--slice-start:71.42857%;--slice-end:14.285716%;--tone:#20c9d1"><div class="gwm-ora5-colors-v2__panel-bg"></div><img src="images/sea-blue-1920.webp" width="1920" height="1234" alt="ORA 5 in Sea Blue"></div>
        <div class="gwm-ora5-colors-v2__panel" data-color-panel="1" data-slice-start="85.714284" data-slice-end="0" style="--slice-start:85.714284%;--slice-end:0%;--tone:#191919"><div class="gwm-ora5-colors-v2__panel-bg"></div><img src="images/night-black-1920.webp" width="1920" height="1234" alt="ORA 5 in Night Black"></div>
      </div>
      <div class="gwm-ora5-colors-v2__hover-zones" aria-hidden="true"><span data-hover-index="0"></span><span data-hover-index="4"></span><span data-hover-index="2"></span><span data-hover-index="5"></span><span data-hover-index="3"></span><span data-hover-index="6"></span><span data-hover-index="1"></span></div>
      <div class="gwm-ora5-colors-v2__footer" aria-hidden="true"></div>
      <div class="gwm-ora5-colors-v2__model-name" data-model-name><span data-name-first>GWM</span> <strong data-name-last>ORA 5</strong></div>
      <p class="gwm-ora5-colors-v2__legal"><strong>ORA 5 SUV</strong> Energieverbrauch 5,1–6,9 l/100 km Benzin; CO₂-Emission 117–158 g/km; CO₂-Klasse D–F; kombinierte Werte. <a href="https://www.gwm-motor.de/ora-5#sternchen" target="_blank" rel="noopener">**</a></p>
      <div class="gwm-ora5-colors-v2__selector" role="group" aria-label="Farbe auswählen">
        <button type="button" aria-label="Dover White, Serienfarbe" aria-pressed="false" data-color-index="0" data-name="Dover White" data-price="Serienfarbe" style="--swatch:#e8e3de"><span></span></button>
        <button type="button" aria-label="Cloud White, 750 Euro" aria-pressed="false" data-color-index="4" data-name="Cloud White" data-price="750 €" style="--swatch:#c4c2be"><span></span></button>
        <button type="button" aria-label="Glacier Grey, 750 Euro" aria-pressed="false" data-color-index="2" data-name="Glacier Grey" data-price="750 €" style="--swatch:#a6a6a6"><span></span></button>
        <button type="button" aria-label="Ayers Grey, 750 Euro" aria-pressed="false" data-color-index="5" data-name="Ayers Grey" data-price="750 €" style="--swatch:#676f7d"><span></span></button>
        <button type="button" aria-label="Forest Green, 750 Euro" aria-pressed="false" data-color-index="3" data-name="Forest Green" data-price="750 €" style="--swatch:#0c4836"><span></span></button>
        <button type="button" aria-label="Sea Blue, 750 Euro" aria-pressed="false" data-color-index="6" data-name="Sea Blue" data-price="750 €" style="--swatch:#20c9d1"><span></span></button>
        <button type="button" aria-label="Night Black, 750 Euro" aria-pressed="false" data-color-index="1" data-name="Night Black" data-price="750 €" style="--swatch:#191919"><span></span></button>
      </div>
      <p class="gwm-ora5-colors-v2__status sr-only" aria-live="polite" data-color-status></p>
    </section>
  </div>
  <script src="module.js?v=1"></script>
</body>
</html>
